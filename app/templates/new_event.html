{% extends "base.html" %}

{% block title %}Criar evento — ScalePass{% endblock %}

{% block content %}
<section class="form-card">
    <p class="eyebrow">Organizadores</p>
    <h1>Publicar um evento</h1>
    <p>Preencha os dados principais. O evento aparecerá imediatamente no catálogo.</p>
    {% if error %}<p class="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/events">
        <label>Título
            <input type="text" name="title" maxlength="160" required autofocus>
        </label>
        <label>Descrição
            <textarea name="description" rows="5" required></textarea>
        </label>
        <div class="form-row">
            <label>Local
                <input type="text" name="venue" maxlength="200" required>
            </label>
            <label>Data e horário
                <input type="datetime-local" name="event_date" required>
            </label>
        </div>
        <div class="form-row">
            <label>Preço por ingresso (R$)
                <input type="number" name="price" min="0" step="0.01" required>
            </label>
            <label>Ingressos disponíveis
                <input type="number" name="available_tickets" min="1" required>
            </label>
        </div>
        <button class="button" type="submit">Publicar evento</button>
    </form>
</section>
{% endblock %}
