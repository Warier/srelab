{% extends "base.html" %}

{% block title %}Entrar — ScalePass{% endblock %}

{% block content %}
<section class="form-card narrow">
    <p class="eyebrow">Acesso</p>
    <h1>Entre no ScalePass</h1>
    {% if error %}<p class="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
        <label>E-mail
            <input type="email" name="email" value="{{ email or '' }}" required autofocus>
        </label>
        <label>Senha
            <input type="password" name="password" required>
        </label>
        <button class="button" type="submit">Entrar</button>
    </form>
    <p class="form-help">Ainda não possui conta? <a href="/register">Criar conta</a></p>
</section>
{% endblock %}
